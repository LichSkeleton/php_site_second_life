<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.(env|sql)$">
        Require all denied
    </FilesMatch>

    PassEnv DB_DRIVER DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD DB_CHARSET APP_URL

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
